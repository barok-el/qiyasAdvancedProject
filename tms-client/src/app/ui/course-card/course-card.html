<article class="card">
    <p class="course-code">{{ course().code }}</p>
    <h3>{{ course().title }}</h3>
    <p class="course-info">Enrolled {{ course().enrollmentCount }} of {{ course().maxCapacity }} seats</p>
    <span
        class="badge"
        [class.closed]="course().enrollmentCount >= course().maxCapacity"
        >
        {{ course().enrollmentCount >= course().maxCapacity ? "Full" : "Accepting enrollments" }}
    </span>
    <a [routerLink]="['/courses', course().id]" class="details-link">View details</a>
    <button type="button"
        (click)="enrollClicked.emit(course())"
        [disabled]="course().enrollmentCount >= course().maxCapacity"
        class="enroll-button"
        >
            Enroll
    </button>
    
</article>
